name: CI

on:
  push:
    tags-ignore:
      - "*"
    branches:
      - "**"
  pull_request:
    branches:
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    env:
      # mise等がGitHub APIを呼び出す際のレート制限（403）回避。
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - run: mise run setup
      # pyfltrの推奨ガイドから意図して外れる個人環境向けの設定。
      # グローバルuv設定の`exclude-newer`からpyfltrだけを除外し、公開直後のpyfltrを使う（uvxはプロジェクトの`[tool.uv]`を読まないためコマンドラインで指定する）。
      - run: uvx --exclude-newer-package pyfltr=false pyfltr ci --output-format=github-annotations
