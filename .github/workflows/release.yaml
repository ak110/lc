name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: バージョン番号の更新タイプ
        required: true
        type: choice
        options:
          - PATCH
          - MINOR
          - MAJOR
        default: PATCH

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      # mise等がGitHub APIを呼び出す際のレート制限（403）回避。
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Prepare release
        id: version
        env:
          RELEASE_BUMP: ${{ inputs.bump }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceCommit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw '起動コミットを取得できません。Gitの状態を確認してください。' }
          $propsPath = 'Directory.Build.props'
          $content = [IO.File]::ReadAllText($propsPath)
          if ($content -notmatch '<Version>(\d+\.\d+\.\d+)</Version>') {
            throw 'Version要素を読み取れません。Directory.Build.propsを確認してください。'
          }
          $currentVersion = $Matches[1]
          $parts = $currentVersion.Split('.')
          $major = [int]$parts[0]
          $minor = [int]$parts[1]
          $patch = [int]$parts[2]
          switch ($env:RELEASE_BUMP) {
            'PATCH' { $patch++ }
            'MINOR' { $minor++; $patch = 0 }
            'MAJOR' { $major++; $minor = 0; $patch = 0 }
            default { throw '版数の更新タイプを確認してください。PATCH・MINOR・MAJORを指定できます。' }
          }
          $newVersion = "$major.$minor.$patch"
          $tags = @(git tag --points-at HEAD)
          if ($LASTEXITCODE -ne 0) { throw 'タグを取得できません。Gitの状態を確認してください。' }
          $tag = $tags | Where-Object { $_ -eq "v$currentVersion" } | Select-Object -First 1
          if (-not $tag) {
            # GitHubの再実行は版数更新前のSHAから始まる。既に公開した子commitのタグを再利用する。
            $candidate = "v$newVersion"
            $tagCommit = git rev-parse --verify --quiet "refs/tags/$candidate^{commit}"
            if ($LASTEXITCODE -eq 0) {
              $parentCommit = git rev-parse --verify "$tagCommit^"
              if ($LASTEXITCODE -ne 0 -or $parentCommit -ne $sourceCommit) {
                throw "タグ $candidate は別の変更に属します。対象コミットと公開済みの版を確認してください。"
              }
              $tag = $candidate
            } elseif ($LASTEXITCODE -eq 1) {
              # タグ不在は初回公開の正常経路。pwshのステップ終了へ終了コード1を渡さない。
              $LASTEXITCODE = 0
            } else {
              throw '既存タグを照合できません。Gitの状態を確認してください。'
            }
          }
          if ($tag) {
            git checkout --detach $tag
            if ($LASTEXITCODE -ne 0) { throw '公開済みの版を取得できません。タグの状態を確認してください。' }
            $newVersion = $tag.Substring(1)
            $ciCommit = git rev-parse --verify 'HEAD^'
            if ($LASTEXITCODE -ne 0) { throw '版数更新前のコミットを取得できません。タグの履歴を確認してください。' }
            'rerun=true' >> $env:GITHUB_OUTPUT
          } else {
            $ciCommit = $sourceCommit
            $regex = [regex]'<Version>[^<]+</Version>'
            [IO.File]::WriteAllText($propsPath, $regex.Replace($content, "<Version>$newVersion</Version>", 1))
            'rerun=false' >> $env:GITHUB_OUTPUT
          }
          "version=$newVersion" >> $env:GITHUB_OUTPUT
          "ci_commit=$ciCommit" >> $env:GITHUB_OUTPUT

      - name: Verify CI passed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $maxAttempts = 45
          $intervalSec = 20
          for ($i = 1; $i -le $maxAttempts; $i++) {
            $conclusion = gh run list --repo=${{ github.repository }} --workflow=ci.yaml `
              --commit=${{ steps.version.outputs.ci_commit }} --limit=1 --json=conclusion --jq='.[0].conclusion'
            $ghExitCode = $LASTEXITCODE
            if ($ghExitCode -ne 0) {
              exit $ghExitCode
            }
            if ($conclusion -eq "success") {
              Write-Host "CI passed."
              exit 0
            }
            if ($conclusion -and $conclusion -ne "null") {
              # 完了しているが success ではない
              Write-Error "CI failed on this commit (status: $conclusion)."
              exit 1
            }
            Write-Host "CI still running... waiting ${intervalSec}s (attempt $i/$maxAttempts)"
            Start-Sleep -Seconds $intervalSec
          }
          Write-Error "Timed out waiting for CI to complete (waited $($maxAttempts * $intervalSec)s)."
          exit 1

      - name: Setup tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Configure git identity
        if: steps.version.outputs.rerun != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build
        run: dotnet publish src/Launcher/Launcher.csproj -c Release -o publish/

      - name: Copy LICENSE and README
        run: |
          Copy-Item LICENSE publish/
          Copy-Item README.md publish/
        shell: pwsh

      - name: Create ZIP
        shell: pwsh
        run: |
          $zipName = "lc-v${{ steps.version.outputs.version }}.zip"
          Compress-Archive -Path publish/* -DestinationPath $zipName

      - name: Update version.json for GitHub Pages
        if: steps.version.outputs.rerun != 'true'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $json = @{
            tag_name = "v$version"
            download_url = "https://github.com/${{ github.repository }}/releases/download/v$version/lc-v$version.zip"
          } | ConvertTo-Json
          Set-Content -Path "docs/public/version.json" -Value $json

      - name: Commit and tag
        if: steps.version.outputs.rerun != 'true'
        run: |
          git add Directory.Build.props docs/public/version.json
          git commit -m "release: v${{ steps.version.outputs.version }}"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin HEAD --tags

      - name: Generate release notes
        run: git cliff --latest --strip=header --output=CHANGES.md

      - name: Append changelog link
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tags = git tag --sort=version:refname | Where-Object { $_ -match '^v\d' }
          $prevTag = $tags[-2]
          Add-Content CHANGES.md "`n**Full Changelog**: https://github.com/${{ github.repository }}/compare/$prevTag...v$version"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tag = "v$version"
          $asset = "lc-v$version.zip"
          $releaseJson = gh release view $tag --json=assets,isDraft
          if ($LASTEXITCODE -eq 0) {
            $release = $releaseJson | ConvertFrom-Json
            if (-not ($release.assets | Where-Object { $_.name -eq $asset })) {
              gh release upload $tag $asset
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            if ($release.isDraft) {
              gh release edit $tag --draft=false
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          } else {
            gh release create $tag $asset --title="$tag" --notes-file=CHANGES.md
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $releaseJson = gh release view $tag --json=assets,isDraft
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $release = $releaseJson | ConvertFrom-Json
          if ($release.isDraft -or -not ($release.assets | Where-Object { $_.name -eq $asset })) {
            throw '配布ZIPの公開を確認できません。Releaseの公開状態とアセットを確認してください。'
          }

      - name: Trigger docs deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yaml
