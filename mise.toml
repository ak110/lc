# 追跡済みのmise.lock（lockfile_version 3）を読める最低版。
min_version = "2026.9.16"

[tools]
uv = "latest"
dotnet = "10"
node = "lts"
# pnpm は mise の npm バックエンドで導入し、版を mise.lock、各プラットフォームの
# integrity を `.mise/locks/npm-pnpm/` で固定する。Node.js 25 以降は Corepack を同梱しない。
# mise registry 既定 (`aqua:pnpm/pnpm`) は aqua-registry の Windows アセット命名
# (`pnpm-win-x64`) と上流リリース (`pnpm-win32-x64.zip`) の齟齬で pnpm 11.x の
# Windows runner インストールが失敗したため、npm バックエンドを明示する。
# `package.json` の `packageManager` で固定すると pnpm-lock.yaml の先頭に版の記録
# （boot 文書）が加わり、GitHub の Dependency Graph が lockfile を解釈できなくなるため、
# 版の照合は `pnpm-workspace.yaml` の `pmOnFail: ignore` で mise 側へ任せる。
"npm:pnpm" = "latest"
pinact = "latest"
git-cliff = "latest"
typos = "latest"

# actionlint の配布物はインストールrootへ実行ファイルと `man`・`docs` ディレクトリを
# 直接展開する。`bin` サブディレクトリが無いため mise はインストールrootをPATHへ加え、
# `man` が `/usr/bin/man` より先に解決されて shim がディレクトリを実行し失敗する。
# `symlink_bins` は実行ファイルだけを `.mise-bins` へ集めてPATHへ加える。
# 既に actionlint を導入済みの環境では、再インストールまたは版の更新を1回行うまで
# PATHは切り替わらない。新規導入の環境では追加の操作を要しない。
# `mise upgrade --bump` はinline tableを単一文字列へ平坦化してoptionsを失うため、
# 版の更新後も `symlink_bins` を保つよう別テーブル形式で書く。
[tools.actionlint]
version = "latest"
symlink_bins = true

# Windowsではシステム側の `C:\Program Files\dotnet\` がPATH先頭に固定されており、
# SDK 8.0が拾われる。Windows用タスクはmiseが管理するdotnet hostを絶対パスで呼ぶ。

[tasks.setup]
description = "開発環境のセットアップ"
run = [
  "pnpm install",
  "git config --unset core.hooksPath || true",
  "uvx prek install -c .pre-commit-config.yaml",
  "git config --local commit.template .gitmessage",
]
run_windows = [
  "pnpm install",
  "git config --unset core.hooksPath & exit /b 0",
  "uvx prek install -c .pre-commit-config.yaml",
  "git config --local commit.template .gitmessage",
]

[tasks.setup-linux]
description = "Linux開発環境のセットアップ（miseのツール導入とsetup）"
# .NETの実行に要るOSのライブラリ（ICU、OpenSSLなど）は事前に導入しておく。
run = [
  "mise install",
  "mise run setup",
]

[tasks.build]
description = "リリースビルド"
run = [
  "dotnet publish src/Launcher/Launcher.csproj -c Release -o publish",
  "cp LICENSE publish/ && cp README.md publish/",
]
run_windows = [
  "\"{{ env.LOCALAPPDATA }}/mise/dotnet-root/dotnet\" publish src/Launcher/Launcher.csproj -c Release -o publish",
  "copy LICENSE publish\\ && copy README.md publish\\",
]

[tasks.clean]
description = "ビルド成果物の削除"
run = "dotnet clean Launcher.sln"
run_windows = "\"{{ env.LOCALAPPDATA }}/mise/dotnet-root/dotnet\" clean Launcher.sln"

[tasks.format]
description = "フォーマット + 軽量lint（開発時の手動実行用。自動修正あり）"
# pyfltrの推奨ガイドから意図して外れる個人環境向けの設定。
# グローバルuv設定の`exclude-newer`からpyfltrだけを除外し、公開直後のpyfltrを使う（uvxはプロジェクトの`[tool.uv]`を読まないためコマンドラインで指定する）。
run = [
  "uvx --exclude-newer-package pyfltr=false pyfltr fast",
]

[tasks.test]
description = "全チェック実行（これを通過すればコミット可能）"
# Linuxではテストのwin-x64 self-containedのtesthostを起動できないため、dotnet-testだけを除く。
run = [
  "uvx --exclude-newer-package pyfltr=false pyfltr run --disable=dotnet-test",
]
run_windows = [
  "uvx --exclude-newer-package pyfltr=false pyfltr run",
]

[tasks.update]
description = "依存パッケージの更新"
# Windows runner 上で pnpm 11 系が対話プロンプトを表示し更新フローを停止させるのを防ぐ。
env = { CI = "true" }
# `mise lock --bump` は pnpm を含む `latest`・`lts`・`"10"` 指定の開発ツールを再解決して mise.lock を更新する。
# pnpm 本体を先に更新して導入してから、新しい pnpm を `mise exec` で起動して依存を更新し、
# 新しい pnpm の依存解決規則を反映した状態でロックファイルを再生成する。
run = [
  "dotnet package update --project Launcher.sln || [ $? -eq 2 ]",
  "mise lock --bump",
  "mise install",
  "mise exec -- pnpm update --latest",
  "bash -c 'GITHUB_TOKEN=$(gh auth token) pinact run --update --min-age=1'",
]
run_windows = [
  "mise lock --bump",
  "mise install",
  "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/update.ps1 \"{{ env.LOCALAPPDATA }}/mise/dotnet-root/dotnet\"",
]

[tasks.docs]
description = "ドキュメントのローカルプレビュー"
run = "pnpm run docs:dev"
