[tool.uv]
exclude-newer = "1 day"

[tool.pyfltr]
preset = "latest"
dotnet = true
# 既定の`dotnet format`はstyle・analyzersの検査でソリューション全体を解析し、CIと手元の律速になる。
# .editorconfigでwarning以上にしたstyle・analyzersの診断はEnforceCodeStyleInBuildとTreatWarningsAsErrorsによりdotnet-buildが検出するため、
# formatの対象は空白とimportの順序（buildが検出しない規則）に限定する。style違反の自動修正は行わない。
dotnet-format-args = ["format", "--diagnostics", "IMPORTS"]
# Windowsで古いmise shimを拾わず、
# node_modules/.binの実行ファイルを直接解決する。
js-runner = "direct"
prettier = true
colloquial-check = true
comment-check = true
# WinFormsデザイナーが編集のたびにコメントを再生成するため対象外にする。
comment-check-exclude = ["*.Designer.cs"]

extend-exclude = [
    "bin",
    "obj",
    "publish",
    "node_modules",
    # miseが生成するnpmツールのlock（mise.lockが内容のdigestを持つ）。整形すると導入済みの版を見失う。
    ".mise",
]
