[tool.uv]
exclude-newer = "1 day"

[tool.pyfltr]
preset = "latest"
dotnet = true
# Windowsで古いmise shimを拾わず、
# node_modules/.binの実行ファイルを直接解決する。
js-runner = "direct"
prettier = true
colloquial-check = true

extend-exclude = [
    "bin",
    "obj",
    "publish",
    "node_modules",
    # miseが生成するnpmツールのlock（mise.lockが内容のdigestを持つ）。整形すると導入済みの版を見失う。
    ".mise",
]
